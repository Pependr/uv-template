on:
    push:
        branches:
            - "master"
            - "main"

jobs:
    run_and_test:
        runs-on: "ubuntu-latest"
        
        steps:
            - uses: actions/checkout@v4

            - name: "Install uv"
              uses: astral-sh/setup-uv@v7
              with:
                enable-cache: true
                cache-local-path: "**/.uv_cache"
                python-version: "3.14.5"
                venv-path: ".venv"
                activate-environment: true

            - name: "Install dependencies"
              run: uv sync --frozen

            - name: "Collect tests report"
              run: uv run pytest --cov --cov-report json
              continue-on-error: true

            - name: "Process report"
              run: |
                uv run honk plugin load covplugin
                export GENERAL="$(uv run honk parse -p coverage.json -t "files/*/summary" map-map --header "files" --excluded-col "*_display")"
                export ANALYSIS="$(uv run honk parse -p coverage.json -t "files/*" group -i "missing_lines" -i "excluded_lines" | honk parse -m json map-map --header "files")"
                printf "$GENERAL\n\n$ANALYSIS" > $GITHUB_STEP_SUMMARY